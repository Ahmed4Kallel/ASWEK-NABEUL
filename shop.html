<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boutique | ASWEK</title>
  <meta name="description" content="Découvrez tout le catalogue ASWEK : résines époxy, silicones pour moules, pigments et colorants, produits piscine, étanchéité et accessoires créatifs en Tunisie.">
  <meta name="keywords" content="boutique ASWEK, résine époxy Tunisie, silicone moule, pigment résine, produit piscine, étanchéité">
  <link rel="canonical" href="shop.html">

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/cart.css">
  <link rel="stylesheet" href="css/ai/search.css">
</head>
<body>
  <div id="rp-header"></div>
  <div class="breadcrumb-bar"><div class="container" id="breadcrumb"></div></div>

  <div class="container mb-5">
    <div class="shop-layout">
      <aside class="shop-sidebar">
        <button class="btn-primary-outline btn-block mb-3" id="mobileFilterToggle" style="display:none;">Afficher les filtres</button>
        <div id="sidebarFilters"></div>
      </aside>
      <div class="shop-main">
        <h1 class="page-title-cat" id="catTitle">Résines</h1>
        <div id="catDescription" class="mb-3"></div>
        <div class="shop-toolbar">
          <div class="small text-muted" id="resultCount"></div>
          <div class="d-flex align-items-center" style="gap:12px;">
            <label class="small">Trier par :</label>
            <select id="orderby">
              <option value="menu_order">ASWEK recommandé</option>
              <option value="popularity">Le plus populaire</option>
              <option value="rating">Note moyenne</option>
              <option value="date">Le plus récent</option>
            </select>
            <div class="view-toggle">
              <button data-view="grid" class="active" title="Grille">▦</button>
              <button data-view="list" title="Liste">☰</button>
            </div>
          </div>
        </div>
        <div class="row grid-list" id="productsGrid"></div>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>
  </div>

  <div id="rp-modals"></div>
  <div id="rp-footer"></div>

  <script src="js/data.js"></script>
<script src="js/ai/overrides.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/shop.js"></script>
  <link rel="stylesheet" href="css/ai/chatbot.css">
  <script src="js/ai/chatbot.js"></script>
  <script src="js/ai/enhance.js"></script>
  <script src="js/ai/i18n.js"></script>
  <script src="js/ai/search-engine.js"></script>
  <script src="js/ai/search-ui.js"></script>
  <script src="js/ai/seo.js"></script>
</body>
</html>
